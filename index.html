<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기억정원 VR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --green:#6b9a5b; --ink:#2b2b2b; --sub:#666; --cream:#fbf7ee; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f7; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; color: var(--ink); }
  #app canvas { display: block; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: linear-gradient(180deg, rgba(191,227,247,.92), rgba(251,247,238,.96)); z-index: 10; }
  #overlay.hidden, .hidden { display: none !important; }
  .lang { float: right; margin: 4px 0 0 12px; padding: 10px 18px; border-radius: 999px; background: #eef4e8; color: #3f5a35; font-weight: 700; font-size: 18px; text-decoration: none; }
  .card { width: min(720px, 100%); background: rgba(255,255,255,.9); border-radius: 32px; padding: 40px 44px; box-shadow: 0 20px 60px rgba(60,80,40,.18); }
  h1 { margin: 0 0 6px; font-size: 44px; } h1 small { font-size: 22px; color: var(--sub); font-weight: 500; margin-left: 8px; }
  p { font-size: 19px; line-height: 1.6; margin: 8px 0; color: #444; }
  .bar { height: 14px; border-radius: 7px; background: #e8efe4; overflow: hidden; margin: 22px 0 10px; }
  .bar > div { height: 100%; width: 0; background: var(--green); transition: width .2s; }
  button.big { display: block; width: 100%; font: 700 24px "Noto Sans KR", sans-serif; padding: 20px; border-radius: 999px; border: 0; cursor: pointer; margin-top: 14px; }
  .primary { background: var(--green); color: #fff; } .primary:disabled { background: #c9d3c4; cursor: default; }
  .secondary { background: #fff; color: var(--ink); border: 2px solid #e3e3dc !important; }
  .note { font-size: 16px; color: var(--sub); margin-top: 8px; }
  ul { padding-left: 22px; margin: 14px 0 0; } li { font-size: 17px; line-height: 1.7; color: #444; }
  #hud { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 10px; justify-content: center; z-index: 5; pointer-events: none; }
  #hud button { pointer-events: auto; font: 700 18px "Noto Sans KR", sans-serif; padding: 12px 22px; border-radius: 999px; color: var(--ink);
    border: 1.5px solid rgba(255,255,255,.75); background: rgba(255,255,255,.28); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 6px 20px rgba(40,60,30,.12); cursor: pointer; transition: background .15s; }
  #hud button:hover { background: rgba(255,255,255,.5); }
  #mic.on { background: var(--green); color: #fff; }
  #toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.35); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1.5px solid rgba(255,255,255,.75); padding: 12px 26px; border-radius: 999px; font-size: 20px; font-weight: 600; opacity: 0; transition: opacity .3s; z-index: 6; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="hud">
  <button id="menuBtn">메뉴 (M)</button>
  <button id="mic">꾹 눌러서 말하기 (V)</button>
  <button id="vrBtn2">VR 시작</button>
</div>
<div id="overlay">
  <div class="card">
    <a id="langLink" class="lang" href="zh/">中文版</a>
    <h1>기억정원 <small>Memory Garden VR</small></h1>
    <p>정원을 가꾸고, 기억 훈련을 하고, 친구들과 티파티를 즐기는 공간이에요.</p>
    <div id="loading">
      <div class="bar"><div id="bar"></div></div>
      <p id="loadtxt" class="note">정원을 불러오는 중…</p>
    </div>
    <div id="mrStart" class="hidden">
      <p class="note">버튼을 누르면 내 방이 보이는 꽃밭(MR)이 시작돼요.</p>
      <button id="btnMR" class="big primary">MR 꽃 따기 시작</button>
      <button id="btnMRBack" class="big secondary">정원(VR)으로 돌아가기</button>
    </div>
    <div id="start" class="hidden">
      <p id="vrnote" class="note"></p>
      <button id="btnVR" class="big primary">VR 시작하기</button>
      <button id="btnMic" class="big secondary">마이크 허용하기 (음성 명령)</button>
      <p id="micnote" class="note">음성으로 메뉴를 고르거나 티파티에서 말하려면 마이크를 허용해 주세요.</p>
      <button id="btnDesk" class="big secondary">화면으로 둘러보기 (헤드셋 없이)</button>
      <ul>
        <li>왼쪽 스틱을 밀면 그 방향으로 걸어가요.</li>
        <li>오른쪽 스틱을 좌우로 밀면 몸을 돌려요.</li>
        <li>X 또는 A 버튼으로 메뉴를 열고 닫아요. B 또는 Y 버튼은 닫기예요.</li>
        <li>쥐기 버튼을 누른 채 말하면 음성으로 고를 수 있어요.</li>
      </ul>
    </div>
  </div>
</div>
<script>
if (location.protocol === 'file:') {
  document.getElementById('loadtxt').innerHTML = '파일을 직접 열면 정원을 불러올 수 없어요.<br>GitHub Pages(https) 주소나 로컬 서버(http://localhost)로 열어 주세요.<br>방법은 README.txt에 있어요.';
}
</script>
<script type="module" src="./js/main.js?v=27"></script>
</body>
</html>
